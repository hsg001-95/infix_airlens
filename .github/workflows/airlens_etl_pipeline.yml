name: Infix AirLens Automated ETL Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-databricks-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract & Sync Live Telemetry to Databricks
        env:
          DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          WAQI_API_TOKEN: ${{ secrets.WAQI_API_TOKEN }}
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
        run: |
          python scripts/sync_live_data.py

      - name: Trigger Databricks ETL Workflow DAG
        if: env.DATABRICKS_JOB_ID != ''
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
        run: |
          RESPONSE=$(curl -sS -f -X POST "https://${DATABRICKS_HOST}/api/2.1/jobs/run-now" \
            -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": ${DATABRICKS_JOB_ID}}") || echo "Databricks Job Trigger Skipped or Non-fatal"
          echo "Triggered Databricks Job Run: $RESPONSE"
